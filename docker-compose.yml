# Rental Cockpit — build and run locally:  docker compose up -d --build
# Then open http://<this machine>:8080 and create the administrator account.
services:
  rental-cockpit:
    build: .
    image: rental-cockpit:local
    container_name: rental-cockpit
    restart: unless-stopped
    ports:
      # Listening address and port are visible here (TEC 05). Keep it on your
      # local network or behind a reverse proxy with HTTPS; never open it on
      # your router without reading docs/en/security.md.
      - "8080:8080"
    volumes:
      - rental-cockpit-data:/data
    environment:
      TZ: Etc/UTC                          # set your own time zone, e.g. Europe/Paris
      # RENTAL_COCKPIT_COOKIE_SECURE: "true"   # when served over HTTPS
      # RENTAL_COCKPIT_DEFAULT_LOCALE: "en"    # language before anyone signs in
      # FORWARDED_ALLOW_IPS: "192.0.2.10"      # IP of your reverse proxy, if any
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rental-cockpit-data:
