name: Bug / Anomalie
description: Something does not work as described. / Quelque chose ne fonctionne pas comme décrit.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Never attach real data**: no invoice, guest name, booking reference, address, database, password or cookie. Reproduce with the demo if you can.
        ⚠️ **Ne joignez jamais de données réelles** : ni facture, ni nom de voyageur, ni référence de réservation, ni adresse, ni base de données, ni mot de passe. Reproduisez avec la démonstration si possible.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Docker Compose, Python (pip), Other / Autre]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps / Étapes
      description: What did you do? / Qu'avez-vous fait ?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed / Attendu et constaté
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Confidentialité
      options:
        - label: This report contains no real personal or financial data. / Ce signalement ne contient aucune donnée personnelle ou financière réelle.
          required: true
