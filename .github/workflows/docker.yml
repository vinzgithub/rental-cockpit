# Copyright © 2026 Vincent Fournet
# Docker image: built and started for real on every change; published to the
# GitHub Container Registry for linux/amd64 and linux/arm64.
#   push to main          → ghcr.io/vinzgithub/rental-cockpit:edge
#   tag vX.Y.Z            → :X.Y.Z, :X.Y and :latest
#   pull request (this repository) → :pr-<number>, to test a delivery before it
#                           is merged without touching an existing installation
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rental-cockpit:test
          build-args: VERSION=${{ github.ref_name }}

      - name: Smoke test (read-only, unprivileged container with a data volume)
        run: |
          docker volume create rc-test-data
          docker run -d --name rc --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -v rc-test-data:/data -p 8080:8080 rental-cockpit:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Rental Cockpit"
          curl -fsS http://127.0.0.1:8080/api/session | grep -q '"setup_required":true'
          test "$(docker exec rc id -u)" = "10001"
          docker exec rc python -m rental_cockpit.cli --help > /dev/null
          docker exec rc test -f /data/rental_cockpit.db
          docker exec rc python -m rental_cockpit.cli backup
          docker exec rc sh -c 'ls /data/backups/rental-cockpit-sauvegarde-*.zip'
          docker logs rc

      - name: Sign in to the GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and publish (amd64 + arm64)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: ARM64 image starts (emulated)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
          docker run --rm --platform linux/arm64 --entrypoint python "$image" -c \
            "import platform, rental_cockpit, pypdf; print(platform.machine(), rental_cockpit.__version__, pypdf.__version__)" | tee /dev/stderr | grep -q aarch64
